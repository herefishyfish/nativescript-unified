<!doctype html>
<html lang="en" class="style-vega">
  <head>
    <meta charset="utf-8" />
    <title>NativeScript Unified</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HTML-first NativeScript: one Angular template for web and native." />
    <meta name="theme-color" content="#f2ebdd" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%2327695f%27/%3E%3Cpath d=%27M9 8.5 5.5 12 9 15.5M15 8.5l3.5 3.5-3.5 3.5M13.25 6.75l-2.5 10.5%27 stroke=%27%23f2ebdd%27 stroke-width=%272%27/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ns-unified-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
